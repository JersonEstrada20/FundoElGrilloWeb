<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fundo El Grillo · Administración</title><style>body{font-family:system-ui;margin:0;background:#f6f2e8;color:#16362d}.wrap{max-width:1000px;margin:auto;padding:32px 20px}.panel{background:white;border:1px solid #d8d4c8;border-radius:18px;padding:22px;margin:16px 0}h1{font-size:38px}.muted{color:#69756c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}input,select,button{font:inherit;padding:11px;border:1px solid #d8d4c8;border-radius:9px}button{background:#1f4b3f;color:#fff;cursor:pointer}.row{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:12px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/">← Volver al sitio</a><h1>Panel privado</h1><p class="muted">La identidad se valida mediante Cloudflare Access. El dueño y administradores pueden gestionar permisos.</p><section class="panel"><h2>Mi sesión</h2><div id="me">Cargando…</div></section><section class="panel" id="manage" hidden><h2>Agregar recepcionista</h2><form id="staffForm" class="grid"><input name="full_name" placeholder="Nombre completo" required><input name="email" type="email" placeholder="Correo de acceso" required><select name="role"><option value="receptionist">Recepcionista</option><option value="admin">Administrador</option></select><button>Agregar usuario</button></form><div id="staffList"></div></section><section class="panel"><h2>Últimos ingresos</h2><div id="visits">Cargando…</div></section></main><script>const j=async(u,o)=>{const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d};(async()=>{try{const m=await j('/api/me');document.querySelector('#me').textContent=`${m.staff.full_name} · ${m.staff.role}`;if(['owner','admin'].includes(m.staff.role)){manage.hidden=false;const s=await j('/api/staff');staffList.innerHTML=s.staff.map(x=>`<div class="row"><span>${x.full_name} · ${x.email}</span><b>${x.role}</b></div>`).join('')}}catch(e){me.textContent=e.message}})();j('/api/visits?limit=50').then(d=>visits.innerHTML=d.visits.map(v=>`<div class="row"><span>${new Date(v.created_at).toLocaleString('es-CL')} · ${v.registered_by}</span><b>${v.people_count} personas</b></div>`).join('')).catch(e=>visits.textContent=e.message);staffForm.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await j('/api/staff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});location.reload()}</script></body></html>
