<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fundo El Grillo · Recepción</title>
  <style>
    :root{--bg:#f7f3ea;--surface:#fffdfa;--surface2:#f1eadc;--ink:#183c32;--muted:#68766c;--line:#d9d0c1;--green:#356c4d;--red:#963436;--shadow:0 14px 35px rgba(34,54,43,.09)}
    html[data-theme="dark"]{--bg:#1d1b18;--surface:#26231e;--surface2:#332f28;--ink:#f4eee4;--muted:#cfc3b2;--line:#474136;--green:#5f9269;--red:#c45b59;--shadow:none}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,ui-serif,serif}.shell{max-width:840px;margin:auto;padding:36px 22px 70px}.brand{display:flex;align-items:center;gap:11px;margin:3px 0 4px}.brand img{width:38px;height:38px;object-fit:cover;border-radius:9px}.brand h1{font-size:30px;margin:0;color:var(--green)}.sub{margin:0 0 24px;color:var(--muted);font-size:17px}.theme{position:fixed;right:22px;top:20px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:9px 12px;cursor:pointer}.back{font-family:system-ui,sans-serif;font-size:14px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:22px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin:16px 0}.login{max-width:440px;margin:55px auto}.login .brand{margin-top:0}.login .card{padding:20px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:15px;color:var(--muted)}input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}button{font:inherit;border:0;cursor:pointer;border-radius:10px;padding:13px 16px;font-weight:700}.primary{background:var(--green);color:white;width:100%}.secondary{background:var(--surface2);color:var(--ink);width:100%}.danger{background:transparent;border:1px solid var(--red);color:var(--red)}.login form{display:grid;gap:14px}.hidden{display:none}.topline{display:flex;justify-content:space-between;align-items:center;gap:14px}.topline h2{margin:0;font-size:23px}.person-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;background:color-mix(in srgb,var(--surface) 88%,var(--surface2))}.person-title{color:var(--green);font-size:20px;margin:0 0 16px}.person-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{grid-column:1/-1}.add{margin-top:14px;border:1px solid var(--green);background:transparent;color:var(--green);width:100%}.signature-label{display:block;margin:22px 0 8px;font-size:15px}.signature{width:100%;height:190px;background:#fff;border:1px dashed var(--line);border-radius:11px;touch-action:none}.action-row{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-top:12px}.message{min-height:21px;color:var(--muted);font-family:system-ui,sans-serif;font-size:14px}.visit{padding:16px 0;border-top:1px solid var(--line)}.visit:first-child{border-top:0}.visit small{color:var(--muted)}.guest{background:var(--surface2);border-radius:10px;padding:10px;margin:8px 0;font-family:system-ui,sans-serif;font-size:14px}.visit img{max-width:280px;width:100%;border-radius:8px;border:1px solid var(--line);background:white}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.staff-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 0;font-family:system-ui,sans-serif;font-size:14px}@media(max-width:620px){.shell{padding:24px 15px 50px}.brand h1{font-size:26px}.person-grid,.admin-grid,.action-row{grid-template-columns:1fr}.wide{grid-column:auto}.theme{right:14px;top:12px}.login{margin:35px auto}.topline{align-items:flex-start;flex-direction:column}.signature{height:155px}}
  </style>
</head>
<body>
<button class="theme" id="theme" aria-label="Cambiar tema">◐ Tema</button>
<main class="shell">
  <section id="login" class="login">
    <div class="brand"><img src="/assets/logo-fundo-el-grillo.png" alt=""><h1>Fundo El Grillo</h1></div>
    <p class="sub">Acceso solo personal de recepción</p>
    <div class="card"><form id="loginForm"><div class="field"><label>Usuario / correo</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Contraseña / PIN</label><input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></div><button class="primary">Ingresar</button><p id="loginError" class="message"></p></form></div>
  </section>
  <div id="app" hidden>
    <a class="back" href="/">← Volver al sitio público</a>
    <div class="brand"><img src="/assets/logo-fundo-el-grillo.png" alt=""><h1>Fundo El Grillo</h1></div>
    <p class="sub">Registro digital de ingreso de huéspedes</p>
    <section class="card"><div class="topline"><div><h2>Nuevo ingreso</h2><p id="session" class="sub" style="margin:5px 0 0"></p></div><button id="logout" class="danger">Cerrar sesión</button></div><div id="personList"></div><button id="addPerson" class="add">+ Agregar otra persona del grupo</button><label class="signature-label">Firma de responsabilidad (una persona firma por todo el grupo)</label><canvas id="signature" class="signature" width="760" height="190"></canvas><div class="action-row"><button id="clearSignature" class="secondary">Borrar firma</button><button id="saveVisit" class="primary">Guardar registro</button></div><p id="visitMessage" class="message"></p></section>
    <section class="card" id="manage" hidden><h2>Equipo de recepción</h2><form id="staffForm" class="admin-grid" style="margin-top:15px"><input name="full_name" placeholder="Nombre completo" required><input name="email" type="email" placeholder="Correo de acceso" required><input name="pin" type="password" placeholder="PIN inicial" required><select name="role"><option value="receptionist">Recepcionista</option><option value="admin">Administrador</option></select><button class="primary">Agregar integrante</button></form><div id="staffList"></div></section>
    <section class="card"><h2>Ingresos recientes</h2><div id="visits"><p class="message">Cargando…</p></div></section>
  </div>
<section class="card" id="operations" hidden><h2>Solicitudes de reserva</h2><div id="bookingList"><p class="message">Cargando…</p></div><h2 style="margin-top:30px">Opiniones pendientes</h2><div id="reviewList"><p class="message">Cargando…</p></div></section></main>
<script>
const $=id=>document.getElementById(id),people=[],escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const request=async(u,o)=>{const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d};
const theme=localStorage.getItem('feg-admin-theme');if(theme==='dark')document.documentElement.dataset.theme='dark';$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'';localStorage.setItem('feg-admin-theme',dark?'dark':'light')};
function personForm(i){return '<article class="person-card"><h3 class="person-title">Persona '+(i+1)+'</h3><div class="person-grid"><div class="field"><label>Nombre</label><input data-k="first" required></div><div class="field"><label>Apellido</label><input data-k="last" required></div><div class="field"><label>RUT o pasaporte</label><input data-k="rut"></div><div class="field"><label>Nacionalidad</label><input data-k="nationality" value="Chilena"></div><div class="field"><label>Patente / placa</label><input data-k="plate"></div><div class="field"><label>Cabaña</label><input data-k="cabin" placeholder="Ej. Boldo"></div><div class="field wide"><label>Teléfono</label><input data-k="phone" type="tel"></div></div>'+(i?'<button class="danger remove-person" type="button">Quitar persona</button>':'')+'</article>'}
function renderPeople(){const list=$('personList');list.innerHTML=people.map((_,i)=>personForm(i)).join('');list.querySelectorAll('.remove-person').forEach((b,i)=>b.onclick=()=>{people.splice(i+1,1);renderPeople()})}people.push({});renderPeople();$('addPerson').onclick=()=>{people.push({});renderPeople()};
const canvas=$('signature'),ctx=canvas.getContext('2d');let drawing=false;const pos=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{drawing=true;ctx.beginPath();ctx.lineWidth=2;ctx.strokeStyle='#1c1b19';ctx.moveTo(...pos(e))};canvas.onpointermove=e=>{if(drawing){ctx.lineTo(...pos(e));ctx.stroke()}};window.onpointerup=()=>drawing=false;const clear=()=>ctx.clearRect(0,0,canvas.width,canvas.height);$('clearSignature').onclick=clear;
function collectPeople(){return [...document.querySelectorAll('.person-card')].map(card=>{const v=k=>card.querySelector('[data-k="'+k+'"]').value.trim();return{full_name:(v('first')+' '+v('last')).trim(),rut:v('rut'),phone:v('phone'),plate:v('plate'),nationality:v('nationality'),cabin:v('cabin')}})}
function renderVisits(data){$('visits').innerHTML=data.visits.map(v=>'<article class="visit"><b>'+escape(new Date(v.created_at).toLocaleString('es-CL'))+' · '+escape(v.registered_by)+'</b><small> · '+v.people_count+' persona(s)</small>'+v.people.map(p=>'<div class="guest"><b>'+escape(p.full_name)+'</b><br>RUT: '+escape(p.rut||'—')+' · Teléfono: '+escape(p.phone||'—')+' · Patente: '+escape(p.plate||'—')+' · Nacionalidad: '+escape(p.nationality||'—')+'</div>').join('')+(v.signature_data?'<img src="'+v.signature_data+'" alt="Firma del grupo">':'')+'</article>').join('')||'<p class="message">Aún no hay ingresos.</p>'}
async function load(){const me=await request('/api/me');$('login').hidden=true;$('app').hidden=false;$('session').textContent=me.staff.full_name+' · '+me.staff.role;if(['owner','admin'].includes(me.staff.role)){$('manage').hidden=false;const staff=await request('/api/staff');$('staffList').innerHTML=staff.staff.map(x=>'<div class="staff-row"><span>'+escape(x.full_name)+' · '+escape(x.email)+'</span><b>'+escape(x.role)+'</b></div>').join('')}renderVisits(await request('/api/visits?limit=200'))}
$('saveVisit').onclick=async()=>{const ps=collectPeople();if(ps.some(p=>!p.full_name))return $('visitMessage').textContent='Completa nombre y apellido de cada persona.';if(!ctx.getImageData(0,0,canvas.width,canvas.height).data.some(x=>x!==0))return $('visitMessage').textContent='La firma es necesaria.';$('visitMessage').textContent='Guardando…';try{await request('/api/visits',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({people:ps,signature:canvas.toDataURL('image/png'),notes:ps.map(p=>p.cabin).filter(Boolean).join(', ')})});people.length=0;people.push({});renderPeople();clear();$('visitMessage').textContent='Registro guardado correctamente.';renderVisits(await request('/api/visits?limit=200'))}catch(e){$('visitMessage').textContent=e.message}};
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await request('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});load()}catch(e){$('loginError').textContent=e.message}};$('staffForm').onsubmit=async e=>{e.preventDefault();try{await request('/api/staff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()}catch(e){alert(e.message)}};$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.reload()};request('/api/me').then(load).catch(()=>{});
</script><script src="/admin-ui.js"></script><script src="/admin-operations.js"></script></body></html>
