<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fundo El Grillo · Administración</title><style>body{font-family:system-ui;margin:0;background:#f6f2e8;color:#16362d}.wrap{max-width:1000px;margin:auto;padding:32px 20px}.panel{background:white;border:1px solid #d8d4c8;border-radius:18px;padding:22px;margin:16px 0}h1{font-size:38px}.muted{color:#69756c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}input,select,button{font:inherit;padding:11px;border:1px solid #d8d4c8;border-radius:9px}button{background:#1f4b3f;color:#fff;cursor:pointer}.row{display:flex;justify-content:space-between;gap:14px;border-top:1px solid #eee;padding:12px 0}.login{max-width:440px;margin:50px auto}.login .grid{grid-template-columns:1fr}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/">← Volver al sitio</a><section id="login" class="panel login"><h1>Acceso de recepción</h1><p class="muted">Ingresa con tu correo y PIN. El dueño puede crear y cambiar los permisos del equipo.</p><form id="loginForm" class="grid"><input name="email" type="email" placeholder="Correo" required><input name="pin" type="password" inputmode="numeric" placeholder="PIN de acceso" required><button>Ingresar</button></form><p id="loginError" class="muted"></p></section><div id="app" hidden><h1>Panel privado</h1><p class="muted">Gestiona los ingresos y los permisos del equipo.</p><section class="panel"><h2>Mi sesión</h2><div id="me">Cargando…</div><button id="logout" style="margin-top:12px">Cerrar sesión</button></section><section class="panel" id="manage" hidden><h2>Agregar integrante</h2><form id="staffForm" class="grid"><input name="full_name" placeholder="Nombre completo" required><input name="email" type="email" placeholder="Correo de acceso" required><input name="pin" type="password" placeholder="PIN inicial" required><select name="role"><option value="receptionist">Recepcionista</option><option value="admin">Administrador</option></select><button>Agregar usuario</button></form><div id="staffList"></div></section><section class="panel"><h2>Últimos ingresos</h2><div id="visits">Cargando…</div></section></div></main><script>const j=async(u,o)=>{const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d};const load=async()=>{const m=await j('/api/me');login.hidden=true;app.hidden=false;me.textContent=`${m.staff.full_name} · ${m.staff.role}`;if(['owner','admin'].includes(m.staff.role)){manage.hidden=false;const s=await j('/api/staff');staffList.innerHTML=s.staff.map(x=>`<div class="row"><span>${x.full_name} · ${x.email}</span><b>${x.role}${x.active?'':' · inactivo'}</b></div>`).join('')}const d=await j('/api/visits?limit=50');visits.innerHTML=d.visits.map(v=>`<div class="row"><span>${new Date(v.created_at).toLocaleString('es-CL')} · ${v.registered_by}</span><b>${v.people_count} personas</b></div>`).join('')||'Aún no hay ingresos.'};loginForm.onsubmit=async e=>{e.preventDefault();loginError.textContent='';try{await j('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});load()}catch(e){loginError.textContent=e.message}};staffForm.onsubmit=async e=>{e.preventDefault();try{await j('/api/staff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});location.reload()}catch(e){alert(e.message)}};logout.onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.reload()};j('/api/me').then(load).catch(()=>{})</script></body></html>
